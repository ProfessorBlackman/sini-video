name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t sini:ci .
      - name: Smoke test
        run: |
          test "$(docker run --rm sini:ci --version)" = "$(node -p "require('./packages/cli/package.json').version")"
          docker run --rm --entrypoint ffmpeg sini:ci -version | head -1
