name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before publishing.
  workflow_call:
    inputs:
      skip-docker:
        description: Skip the Docker job (the caller builds and tests the image itself)
        type: boolean
        default: false

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Install Chromium and FFmpeg for render tests
        run: |
          pnpm --filter @sini/render exec playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    if: ${{ !inputs.skip-docker }}
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t sini:ci .
      - name: Smoke test
        run: scripts/smoke-test-image.sh sini:ci
